server:
  host: 0.0.0.0
  port: 8000
  frontend_port: 5173
ollama:
  base_url: http://127.0.0.1:11434
models:
  planner: llama3
  executor: codellama
  reviewer: mistral
agent:
  max_iterations: 20
  auto_test: true
  temperature: 0.7
  max_tokens: 4096
memory:
  enabled: true
  db_path: ./data/memory.db
  max_context_messages: 50
tools:
  shell:
    enabled: true
    timeout: 30
    allowed_commands: []
  browser:
    enabled: true
    timeout: 15
  file_manager:
    enabled: true
    workspace: ./workspace
logging:
  level: INFO
  file: ./data/trimind.log
